<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CALLISTO˚ | Beyond The Future</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #fff; --text: #0a0a0c; --muted: #5a5a65; --line: #e2e2e6; --pad: clamp(1.5rem, 4vw, 4rem); }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
.container { width: min(1320px, calc(100% - 48px)); margin: auto; }
.section { padding: 100px 0; }

header { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 20px var(--pad); border-bottom: 1px solid #eee; }
.brand { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 24px; letter-spacing: 0.15em; }
.brand span { font-size: 13px; }
.nav-wrap { display: flex; align-items: center; gap: 30px; }
nav a { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; }
nav a:hover { opacity: 0.5; }
.bag-btn { background: none; border: 0; position: relative; cursor: pointer; display: flex; align-items: center; }
.bag-count { position: absolute; top: -4px; right: -8px; background: #000; color: #fff; font-size: 9px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

/* HERO HOVER ANIMATION */
.hero { position: relative; height: calc(100vh - 80px); min-height: 620px; background: #e9ebef; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; transition: opacity 0.45s ease-in-out; }
.hero-bg.hover-img { opacity: 0; }
.hero:hover .hero-bg.hover-img { opacity: 1; }

.hero-content { position: absolute; z-index: 10; top: 12vh; left: var(--pad); pointer-events: none; }
h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(2.5rem, 5.5vw, 5rem); font-weight: 900; line-height: 1.05; letter-spacing: 0.08em; margin: 15px 0; }
h1 span { display: block; }
.btn { display: inline-flex; pointer-events: auto; align-items: center; justify-content: center; padding: 14px 28px; background: rgba(255,255,255,0.85); border: 1px solid #888; color: #000; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; backdrop-filter: blur(5px); transition: 0.2s; cursor: pointer; }
.btn:hover { background: #000; color: #fff; border-color: #000; }
.btn-dark { background: #0a0a0c; color: #fff; width: 100%; }
.btn-dark:hover { background: #222; }

/* PRODUCTS GRID */
.products-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; margin-top: 40px; }
.product-card { border: 1px solid var(--line); background: #fff; transition: transform 0.3s; }
.product-card:hover { transform: translateY(-5px); }
.product-img-wrap { height: 340px; position: relative; overflow: hidden; background: #f0f0f2; }
.product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
.product-card:hover .product-img-wrap img { transform: scale(1.04); }
.tag-badge { position: absolute; top: 14px; left: 14px; background: #0a0a0c; color: #fff; font-size: 9px; font-weight: 700; padding: 6px 10px; text-transform: uppercase; }
.product-info { padding: 22px; }
.product-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.product-top h3 { font-family: 'Orbitron', sans-serif; font-size: 15px; margin: 0; }
.price { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; }
.product-desc { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }

/* CART DRAWER */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; }
.drawer-backdrop.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: #fff; z-index: 210; padding: 28px; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
.drawer.open { transform: translateX(0); }
.drawer-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-family: 'Orbitron', sans-serif; }
.drawer-items { flex: 1; overflow-y: auto; padding: 20px 0; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px; }

@media(max-width:850px) { .products-grid { grid-template-columns: 1fr; } .nav-wrap nav a { display: none; } }
</style>
</head>
<body>

<header>
  <a href="#home" class="brand">CALLISTO<span>˚</span></a>
  <div class="nav-wrap">
    <nav>
      <a href="#shop">Shop</a>
      <a href="#collections">Collections</a>
      <a href="#contact">Contact</a>
    </nav>
    <button type="button" class="bag-btn" id="openBagBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="bag-count" id="bagCount">0</span>
    </button>
  </div>
</header>

<main>
  <!-- HERO SECTION WITH HOVER ROBOT ANIMATION -->
  <section id="home" class="hero">
    <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=1600&q=85" alt="Robot Base" class="hero-bg base-img">
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1600&q=85" alt="Robot Hover" class="hero-bg hover-img">

    <div class="hero-content">
      <p style="font-size:11px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Future Forward Fashion</p>
      <h1>
        <span>BEYOND</span>
        <span>THE</span>
        <span>FUTURE</span>
      </h1>
      <a href="#shop" class="btn">SHOP NOW ↗</a>
    </div>
  </section>

  <!-- SHOP -->
  <section id="shop" class="section">
    <div class="container">
      <p style="font-size:11px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">01 / Season Drop</p>
      <h2 style="font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(28px,4vw,45px);margin-bottom:16px">FEATURED PIECES.</h2>
      <p style="color:var(--muted);font-size:15px;max-width:500px;margin-bottom:30px">Architectural silhouettes and liquid-chrome textiles engineered for tomorrow.</p>
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </section>
</main>

<!-- CART DRAWER -->
<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="cartDrawer">
  <div class="drawer-header">
    <strong>YOUR BAG</strong>
    <button type="button" id="closeBagBtn" style="background:none;border:0;font-size:22px;cursor:pointer">×</button>
  </div>
  <div class="drawer-items" id="cartItems"></div>
  <div style="border-top:1px solid var(--line);padding-top:18px">
    <div style="display:flex;justify-content:space-between;margin-bottom:16px;font-family:'Orbitron',sans-serif;font-weight:700">
      <span>TOTAL</span>
      <span id="cartTotal">$0</span>
    </div>
    <button type="button" id="checkoutBtn" class="btn btn-dark" onclick="alert('Order placed successfully!')">Checkout ↗</button>
  </div>
</aside>

<script>
const products = [
  { id: 1, title: "AERO-CHROME BODYSUIT", price: 480, tag: "LIMITED DROP", desc: "Sculpted liquid-silver metallic shell.", img: "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=800&q=80" },
  { id: 2, title: "CYBER-VISOR MK.IV", price: 290, tag: "BESTSELLER", desc: "Iridescent blue-tint shield lens.", img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80" },
  { id: 3, title: "MONOLITH PUFFER", price: 620, tag: "NEW", desc: "Architectural cropped reflective silver nylon.", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=800&q=80" }
];

let cart = [];
function renderProducts() {
  document.getElementById("productsGrid").innerHTML = products.map(p => `
    <article class="product-card">
      <div class="product-img-wrap"><span class="tag-badge">${p.tag}</span><img src="${p.img}" alt="${p.title}"></div>
      <div class="product-info">
        <div class="product-top"><h3>${p.title}</h3><span class="price">$${p.price}</span></div>
        <p class="product-desc">${p.desc}</p>
        <button class="btn btn-dark" onclick="addToCart(${p.id})">Add to Bag +</button>
      </div>
    </article>
  `).join("");
}

function addToCart(id) {
  cart.push(products.find(p => p.id === id));
  updateCartUI();
  document.getElementById("cartDrawer").classList.add("open");
  document.getElementById("drawerBackdrop").classList.add("open");
}

function updateCartUI() {
  document.getElementById("bagCount").textContent = cart.length;
  let sum = 0;
  document.getElementById("cartItems").innerHTML = cart.length === 0 ? '<p style="color:var(--muted);font-size:13px">Your bag is empty.</p>' : cart.map((item, idx) => {
    sum += item.price;
    return `<div class="cart-item"><div><strong>${item.title}</strong><br>$${item.price}</div><button onclick="cart.splice(${idx},1);updateCartUI()" style="background:none;border:0;color:red;cursor:pointer">Remove</button></div>`;
  }).join("");
  document.getElementById("cartTotal").textContent = "$" + sum;
}

document.getElementById("openBagBtn").onclick = () => { document.getElementById("cartDrawer").classList.add("open"); document.getElementById("drawerBackdrop").classList.add("open"); };
document.getElementById("closeBagBtn").onclick = document.getElementById("drawerBackdrop").onclick = () => { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("drawerBackdrop").classList.remove("open"); };
renderProducts();
</script>
</body>
</html>
